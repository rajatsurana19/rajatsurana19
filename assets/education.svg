<style>.deg{font:600 16px 'Inter','Segoe UI',system-ui,sans-serif;fill:#E2E8F0}.big{font:700 34px 'Inter','Segoe UI',system-ui,sans-serif;fill:#E2E8F0;letter-spacing:-1px}.unit{font:400 11px 'JetBrains Mono','SF Mono',Consolas,monospace;fill:#8B96A8}
