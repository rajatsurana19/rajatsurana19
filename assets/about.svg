<text x="48" y="86" class="p" style="animation-delay:0.4s">I am a Computer Engineering student in Mumbai who builds backend systems and privacy-first software. I</text><text x="48" y="110" class="p" style="animation-delay:0.75s">work mostly in Java with Spring Boot, and in Python with FastAPI. I care about concurrency, API security</text><text x="48" y="134" class="p" style="animation-delay:1.1s">and caching, and I measure what I build. I am looking for a Software Engineer internship.</text></svg>